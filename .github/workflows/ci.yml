name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debrand-audit:
    name: Debrand Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run debranding audit
        run: bash scripts/audit-debrand.sh

  build-and-test:
    name: Build & Test (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          PLATFORM_PKG=$("$SDKMANAGER" --list | grep -oE 'platforms;android-37(\.0)?' | head -n 1 || true)
          PLATFORM_PKG="${PLATFORM_PKG:-platforms;android-37.0}"
          echo "Installing $PLATFORM_PKG"
          "$SDKMANAGER" --install \
            "$PLATFORM_PKG" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97'
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: domain/libthreema

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble Treslibre Debug APK (arm64)
        run: ./gradlew :app:assembleTreslibreDebug -PcargoTargets=arm64 --no-daemon

      - name: Run domain unit tests
        run: ./gradlew :domain:test -PcargoTargets=arm64 --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: treslibre-android-arm64-debug
          path: app/build/outputs/apk/treslibre/debug/app-treslibre-arm64-v8a-debug.apk
